name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Receipt parser tests
        working-directory: ios/BillParser
        run: swift test
      - name: Build iPhone app
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project GetBlessed.xcodeproj -scheme GetBlessed \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -50
          exit ${PIPESTATUS[0]}
