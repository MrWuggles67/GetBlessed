<style>

  --accent: #46B386; --accent-ink: #06140E; --accent-soft: #173327; --gold: #E5B04B; --gold-soft: #33280F;
  --warn: #F0A24A; --warn-soft: #35250F; --danger: #FF8A80; --paper: #F4F1EA; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);

  --accent: #46B386; --accent-ink: #06140E; --accent-soft: #173327; --gold: #E5B04B; --gold-soft: #33280F;

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Pricing (mirrors backend/src/pricing.js)
// ---------------------------------------------------------------------------
const PLANS = [
  { id: "monthly", name: "Monthly", period: "month", priceCents: 999, note: "Renews every month" },
  { id: "yearly", name: "1-Year", period: "year", priceCents: 6999, note: "Renews every year", save: "Save 42%" },
  { id: "two_year", name: "2-Year", period: "2 years", priceCents: 10499, note: "One payment for 2 years, doesn't renew", save: "Save 56%" },
];
const TIP_FEE_CENTS = 199, TIP_PER_CENTS = 80000;
const tipFee = (cents) => cents > 0 ? TIP_FEE_CENTS * Math.ceil(cents / TIP_PER_CENTS) : 0;

// ---------------------------------------------------------------------------
// Receipt parser (a JavaScript port of ios/BillParser/ReceiptParser.swift)
// ---------------------------------------------------------------------------
const Parser = (() => {
  const AMOUNT = /^(.*?)\s*(-)?\s*\$?\s*(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})\s*(-)?(?:\s+[A-Z*]{1,2})?$/;
  const QTY_AT = /^(.*?)\s*(\d+(?:\.\d+)?)\s*(?:lb|lbs|kg|oz|ea)?\s*(?:@|x|X|×)\s*\$?(\d+\.\d{2})\s*(?:\/\s*(?:lb|kg|oz|ea))?\s*(?:ea)?$/;
  const LEAD_QTY = /^(\d{1,3})\s*(?:x|X|×|@)?\s+(.+)$/;
  const UNITS = new Set(["oz","lb","lbs","ml","l","g","kg","ct","pk","pc","in","ft","gal","qt","pt"]);
  const cents = (whole, frac) => Number(whole.replace(/,/g, "")) * 100 + Number(frac);

  function classify(label) {
    const t = " " + label.toLowerCase().replace(/[^a-z ]/g, " ").replace(/ +/g, " ").trim() + " ";
    const has = (ws) => ws.some((w) => t.includes(" " + w + " "));
    if (has(["subtotal","sub total","sub ttl","subttl","net total","merchandise total"])) return "subtotal";
    if (has(["total savings","you saved","total items","items sold","total discount","savings"])) return "ignored";
    if (has(["total","ttl","amount due","balance due","total due","amount owed","please pay","new balance","current balance","grand total","pay this amount"])) return "total";
    if (has(["tax","taxes","sales tax","vat","gst","hst","pst","state tax","city tax"])) return "tax";
    if (has(["change","change due","cash","visa","mastercard","master card","amex","discover","debit","credit","tender","tendered","payment","paid","auth","approval","acct","discount","coupon","promo","rounding","previous balance","balance forward","points"])) return "ignored";
    return "item";
  }
  function splitAmount(row) {
    const m = row.match(AMOUNT);
    if (!m) return null;
    let c = cents(m[3], m[4]);
    if (m[2] || m[5]) c = -c;
    return { label: (m[1] || "").trim(), cents: c };
  }
  function splitQuantity(label) {
    let m = label.match(QTY_AT);
    if (m && Number(m[2]) > 0) return { name: m[1] || "", qty: Number(m[2]), unitCents: Math.round(Number(m[3]) * 100) };
    m = label.match(LEAD_QTY);
    if (m) {
      const qty = Number(m[1]); const rest = m[2];
      const first = (rest.split(" ")[0] || "").toLowerCase();
      if (qty > 1 && qty <= 99 && !UNITS.has(first) && /^\p{L}/u.test(rest)) return { name: rest, qty, unitCents: null };
    }
    return { name: label, qty: 1, unitCents: null };
  }
  const tidy = (n) => n.replace(/\b\d{5,}\b/g, "").replace(/^[\s\-–.:*#]+|[\s\-–.:*#@]+$/g, "").replace(/ {2,}/g, " ").trim();
  const wordy = (t) => (t.match(/\p{L}/gu) || []).length >= 2;
  // OCR often reads a zero next to digits as the letter O.
  const fixDigits = (r) => r.replace(/(\d[.,]?)[Oo]/g, "$10").replace(/[Oo]([.,]?\d)/g, "0$1").replace(/\s+/g, " ").trim();

  function parse(rows) {
    const items = []; const totals = [];
    let tax = 0, printedSubtotal = null, merchant = null, pending = null;
    for (const raw of rows) {
      const row = fixDigits(raw);
      if (!row) continue;
      const split = splitAmount(row);
      if (!split) {
        if (merchant === null && !items.length && !totals.length && wordy(row)) merchant = row;
        else if (!totals.length && wordy(row) && classify(row) === "item") pending = row;
        else pending = null;
        continue;
      }
      const kind = classify(split.label);
      if (kind === "total") totals.push(split.cents);
      else if (kind === "subtotal") printedSubtotal = split.cents;
      else if (kind === "tax") tax += split.cents;
      else if (kind === "item" && !totals.length && split.cents > 0) {
        let { name, qty, unitCents } = splitQuantity(split.label);
        if (!name && pending) name = pending;
        name = tidy(name);
        if (name && wordy(name)) {
          items.push({ name, qty, lineCents: split.cents, unitCents: unitCents ?? Math.round(split.cents / qty) });
        }
      }
      pending = null;
    }
    const sum = items.reduce((s, i) => s + i.lineCents, 0);
    const subtotal = items.length ? sum : (printedSubtotal ?? 0);
    const printed = totals.length ? Math.max(...totals) : null;
    return { merchant, items, subtotal, tax, total: printed ?? subtotal + tax, totalWasPrinted: printed !== null };
  }
  return { parse };
})();

// ---------------------------------------------------------------------------
// Sample bills: drawn as receipt images so the text reader reads them for real
// ---------------------------------------------------------------------------
const SAMPLES = {
  grocery: { title: "Groceries for the week", lines: [
    ["c", "CORNER MARKET"], ["c", "418 Elm Street"], ["c", "10/24/2026  5:42 PM"], ["-"],
    ["r", "MILK 2% GAL", "4.29"], ["r", "BREAD WHEAT", "3.49"], ["r", "EGGS LARGE DOZEN", "3.99"],
    ["r", "2 x CHICKEN BREAST", "13.98"], ["r", "RICE 5LB", "6.79"], ["r", "BANANAS", "1.84"], ["-"],
    ["r", "SUBTOTAL", "34.38"], ["r", "TAX", "1.12"], ["r", "TOTAL", "35.50"], ["r", "VISA", "35.50"], ["c", "THANK YOU"],
  ] },
  electric: { title: "Electric bill", lines: [
    ["c", "CITY POWER & LIGHT"], ["c", "Statement date 10/02/2026"], ["l", "Account 0045821-7"], ["-"],
    ["r", "Previous Balance", "141.10"], ["r", "Payment Received", "-141.10"],
    ["r", "Electric Service", "112.40"], ["r", "Delivery Charge", "24.15"], ["r", "Taxes", "6.81"], ["-"],
    ["r", "Amount Due", "143.36"], ["c", "Due by 11/01/2026"],
  ] },
  pharmacy: { title: "Prescriptions", lines: [
    ["c", "WELLSPRING PHARMACY"], ["c", "Rx Pickup"], ["-"],
    ["r", "INSULIN GLARGINE", "98.00"], ["r", "TEST STRIPS 50CT", "34.99"], ["r", "LANCETS", "8.49"], ["-"],
    ["r", "SUBTOTAL", "141.48"], ["r", "TAX", "0.68"], ["r", "TOTAL", "142.16"],
  ] },
  diner: { title: "Family dinner", lines: [
    ["c", "JOE'S DINER"], ["-"],
    ["r", "2 x CHEESEBURGER", "21.98"], ["r", "3 COFFEE", "7.50"], ["r", "KIDS PANCAKES", "6.25"], ["r", "FRIES 2 @ 3.25", "6.50"], ["-"],
    ["r", "SUBTOTAL", "42.23"], ["r", "TAX", "3.48"], ["r", "TOTAL", "45.71"],
  ] },
};
const sampleImageCache = {};
function sampleImage(key) {
  if (sampleImageCache[key]) return sampleImageCache[key];
  const lines = SAMPLES[key].lines;
  const W = 640, lh = 40, pad = 40;
  const c = document.createElement("canvas");
  c.width = W; c.height = pad * 2 + lines.length * lh;
  const g = c.getContext("2d");
  g.fillStyle = "#fffdf8"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#1b1b1b"; g.font = "500 26px 'IBM Plex Mono', Menlo, monospace"; g.textBaseline = "middle";
  lines.forEach((l, i) => {
    const y = pad + i * lh + lh / 2;
    if (l[0] === "-") { g.fillRect(pad, y, W - pad * 2, 2); return; }
    if (l[0] === "c") { g.textAlign = "center"; g.fillText(l[1], W / 2, y); }
    if (l[0] === "l") { g.textAlign = "left"; g.fillText(l[1], pad, y); }
    if (l[0] === "r") { g.textAlign = "left"; g.fillText(l[1], pad, y); g.textAlign = "right"; g.fillText(l[2], W - pad, y); }
  });
  return (sampleImageCache[key] = c.toDataURL("image/png"));
}

// ---------------------------------------------------------------------------
// Text reader (Tesseract, bundled with the demo so it runs offline-capable)
// ---------------------------------------------------------------------------
let ocrWorkerPromise = null;
function ocrWorker(onStatus) {
  ocrStatusListener = onStatus;
  if (!ocrWorkerPromise) {
    const base = new URL("ocr/", location.href).href;
    onStatus?.("Getting the text reader ready (first time only)", 0.05, false);
    ocrWorkerPromise = Tesseract.createWorker("eng", 1, {
      workerPath: base + "worker.js",   // includes a shim that loads the model from lang/eng.traineddata.txt
      corePath: base + "core",
      langPath: base + "lang",
      workerBlobURL: false,
      cacheMethod: "none",
      logger: (m) => ocrLogger(m),
    }).catch((err) => { ocrWorkerPromise = null; throw err; });
  }
  return ocrWorkerPromise;
}
let ocrStatusListener = null;
function ocrLogger(m) {
  if (!ocrStatusListener) return;
  const label = m.status === "recognizing text" ? "Reading the items on your bill" : "Getting the text reader ready (first time only)";
  ocrStatusListener(label, m.progress || 0, m.status === "recognizing text");
}
async function readBill(imageSrc, onStatus) {
  const worker = await ocrWorker(onStatus);
  await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
  const { data } = await worker.recognize(imageSrc);
  const rows = (data.lines || []).map((l) => l.text.trim()).filter(Boolean);
  return { rows, raw: rows.join("\n"), parsed: Parser.parse(rows) };
}

}
function planPicker(selected) {

function planFooter() {
  return `<p class="group-note">Paid through your Apple ID. Monthly and 1-Year renew automatically until cancelled. Each time you bless a bill, a Tip Service Fee of $1.99 for every $800 blessed is added.</p>`;

function billCard(b, showPoster) {
  const pct = b.total ? Math.min(100, Math.round(b.blessedCents / b.total * 100)) : 0;

    <div class="meta">

function totalsBlock(subtotal) {
  return `<div class="row"><div class="grow muted">Items subtotal</div><div class="value">${money(subtotal)}</div></div>
    <div class="row"><label class="grow muted" for="p-tax">Tax</label><div class="money-input"><span>$</span><input id="p-tax" class="num" data-key="tax" inputmode="decimal" value="${esc(draft.tax)}" style="width:90px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--bg)"></div></div>
    <div class="row total"><label class="grow" for="p-total">Complete total</label><div class="money-input"><span>$</span><input id="p-total" class="num" data-key="total" inputmode="decimal" value="${esc(draft.total)}" style="width:110px;text-align:right;font-weight:800;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--bg)"></div></div>`;

function mismatchNote(itemsPlusTax, total) {
  return `<div class="notice warn">${ICONS.warn}<div>Items plus tax come to <b>${money(itemsPlusTax)}</b>, but the total is <b>${money(total)}</b>. Fees or discounts can cause this. Please double check.</div></div>`;
}

// ---------------------------------------------------------------------------
const sheets = {

    return `<h3>${esc(u.displayName)}</h3>

        <div class="row"><div class="grow muted">Email</div><div class="value">${esc(u.email)}</div></div>
        ${u.role === "blessings" ? `<div class="row"><div class="grow muted">Plan</div><div class="value">${hasPlan(u) ? PLANS.find((p) => p.id === u.plan).name + " · until " + new Date(u.planExpires).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "None"}</div></div>
        <div class="row"><div class="grow muted">Yearly income (private)</div><div class="value">${money(u.annualIncomeCents || 0)}</div></div>` : ""}
      </div>

  },
  purchase({ plan }) {

    return `<h3>App Store</h3>
      <div class="appstore">
        <div class="sku"><div class="mark">${ICONS.heart.replace("<svg", '<svg width="26" height="26"')}</div>
          <div class="grow"><b>GetBlessed Blessings ${p.name}</b><div class="muted" style="font-size:14px">${p.note}</div></div></div>
        <div class="row" style="padding:0"><div class="grow muted">Price</div><div class="value">${money(p.priceCents)}${p.id === "two_year" ? "" : " / " + p.period}</div></div>
        <div class="notice warn">${ICONS.info}<div>Demo purchase. You won't be charged. In the real app this is Apple's own payment sheet.</div></div>
      </div>
      <button class="btn" data-act="confirm-purchase" data-plan="${p.id}">Subscribe</button>
      <button class="btn secondary" data-act="close-sheet">Cancel</button>`;
  },
  bless({ id, amount = "" }) {
    const b = db.bills.find((x) => x.id === id);
    const cents = toCents(amount) ?? 0, fee = tipFee(cents), left = remaining(b);
    const tooMuch = cents > left;
    return `<h3>Bless ${esc(userById(b.userId)?.displayName)}'s bill</h3>
      <div class="group">
        <div class="row"><div class="grow">${esc(b.title)}</div><div class="value">${money(b.total)}</div></div>
        <div class="row"><div class="grow muted">Still needed</div><div class="value">${money(left)}</div></div>
      </div>
      <div class="group"><div class="field"><label for="bless-amount">How much would you like to bless?</label>
        <div class="money-input" style="font-size:28px;font-weight:800"><span>$</span><input id="bless-amount" class="num" inputmode="decimal" value="${esc(amount)}" placeholder="0.00" style="font-size:28px;font-weight:800;border:0;outline:none;background:transparent;width:100%"></div></div></div>
      <div class="hstack">
        ${[25, 50, 100].filter((v) => v * 100 < left).map((v) => `<button class="chip" data-act="bless-amount" data-v="${v}.00">$${v}</button>`).join("")}
        <button class="chip" data-act="bless-amount" data-v="${centsToInput(left)}">Full ${money(left)}</button>
      </div>
      <div class="group" id="bless-breakdown">${blessBreakdown(cents, fee)}</div>
      <p class="group-note" style="margin-top:-4px">The Tip Service Fee is $1.99 for every $800 blessed ($0.01 to $800 is $1.99, $800.01 to $1,600 is $3.98, and so on).</p>
      <div id="bless-error">${tooMuch ? `<div class="notice error">${ICONS.warn}<div>You can bless up to ${money(left)} on this bill.</div></div>` : ""}</div>
      <button class="btn gold" data-act="bless-pay" data-id="${b.id}" ${cents <= 0 || tooMuch ? "disabled" : ""}>Continue to payment</button>`;
  },
  pay({ id, cents }) {
    const fee = tipFee(cents);
    return `<h3>Payment</h3>
      <div class="group">${blessBreakdown(cents, fee)}</div>
      <div class="group">
        <div class="field"><label for="card-num">Card number</label><input id="card-num" class="mono" value="4242 4242 4242 4242" inputmode="numeric"></div>
        <div class="field" style="flex-direction:row;gap:16px"><div style="flex:1"><label for="card-exp">Expires</label><input id="card-exp" class="mono" value="12 / 29"></div><div style="flex:1"><label for="card-cvc">CVC</label><input id="card-cvc" class="mono" value="123"></div></div>
      </div>
      <div class="notice warn">${ICONS.info}<div>Demo card. No money moves. The real app takes the card with Stripe.</div></div>
      <button class="btn gold" data-act="confirm-pay" data-id="${id}" data-cents="${cents}">Pay ${money(cents + fee)}</button>
      <button class="btn secondary" data-act="close-sheet">Cancel</button>`;
  },
  thanks({ id, cents }) {
    const b = db.bills.find((x) => x.id === id);
    return `<div class="center stack" style="padding:12px 0">
      <div style="margin:0 auto;color:var(--gold)">${ICONS.gift.replace("<svg", '<svg width="56" height="56"')}</div>
      <h3>Thank you for the blessing!</h3>
      <p class="muted" style="margin:0">${esc(userById(b.userId)?.displayName)} has been blessed with ${money(cents)}.${remaining(b) === 0 ? " Their bill is now fully covered." : ` ${money(remaining(b))} is still needed.`}</p>
      </div>
      <button class="btn" data-act="close-sheet">Done</button>`;
  },
};
function blessBreakdown(cents, fee) {
  return `<div class="row"><div class="grow muted">Blessing</div><div class="value">${money(cents)}</div></div>
    <div class="row"><div class="grow muted">Tip Service Fee${cents > 0 ? ` <span class="muted" style="font-size:13px">(${fee / TIP_FEE_CENTS} × $1.99)</span>` : ""}</div><div class="value">${money(fee)}</div></div>
    <div class="row total"><div class="grow">You pay</div><div class="value">${money(cents + fee)}</div></div>`;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render() {
  if (!nav.length) return home();
  const { screen } = nav.at(-1);
  if (screen !== "post") draft = null;
  app.innerHTML = screens[screen]();
  const scroller = app.querySelector(".screen");
  if (scroller) scroller.scrollTop = 0;
}
function renderSheet() {
  document.querySelector(".sheet-backdrop")?.remove();
  if (!sheet) return;
  const wrap = document.createElement("div");
  wrap.className = "sheet-backdrop";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${sheets[sheet.type](sheet.params)}</div>`;
  wrap.addEventListener("click", (e) => { if (e.target === wrap) closeSheet(); });
  $("#device").appendChild(wrap);
}

// ---------------------------------------------------------------------------
// Posting a bill: read the picture, then review
// ---------------------------------------------------------------------------
async function startScan(imageSrc, sampleKey = null) {
  draft = { stage: "scanning", image: imageSrc, sampleKey, statusLabel: "Starting…", progress: 0 };
  render();
  try {
    const result = await readBill(imageSrc, (label, progress) => {
      if (!draft || draft.stage !== "scanning") return;
      draft.statusLabel = label; draft.progress = progress;
      const l = $("#scan-label"), bar = $("#scan-bar");
      if (l) l.textContent = label;
      if (bar) bar.style.width = Math.round(progress * 100) + "%";
    });
    if (!draft || draft.image !== imageSrc) return;
    const p = result.parsed;
    Object.assign(draft, {
      stage: "review", raw: result.raw, totalWasPrinted: p.totalWasPrinted,
      title: sampleKey ? SAMPLES[sampleKey].title : (p.merchant ? titleCase(p.merchant) + " bill" : "My bill"),
      merchant: p.merchant ? titleCase(p.merchant) : "", note: "",
      items: p.items.map((i) => ({ name: i.name, qty: String(i.qty), price: centsToInput(i.lineCents) })),
      tax: centsToInput(p.tax), total: centsToInput(p.total),
      error: result.rows.length === 0 ? "No text was found. Try a clearer, well-lit picture of the whole bill." :
        p.items.length === 0 ? "We couldn't find individual items on this bill. Add them below or just enter the total." : null,
    });
  } catch (err) {
    console.error(err);
    Object.assign(draft, { stage: "review", raw: "", items: [], tax: "0.00", total: "0.00", title: "My bill", merchant: "", note: "",
      error: "The text reader couldn't start on this device. You can still enter the items and total by hand." });
  }
  render();
}
function titleCase(s) { return s.toLowerCase().replace(/\b\p{L}/gu, (c) => c.toUpperCase()); }
async function downscale(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  } finally { URL.revokeObjectURL(url); }
}
function refreshTotals() {
  if (!draft || draft.stage !== "review") return;
  const subtotal = draft.items.reduce((s, i) => s + (toCents(i.price) ?? 0), 0);
  const tax = toCents(draft.tax) ?? 0, total = toCents(draft.total) ?? 0;
  const sub = $("#totals .value"); if (sub) sub.textContent = money(subtotal);
  $("#mismatch").innerHTML = Math.abs(subtotal + tax - total) > 1 ? mismatchNote(subtotal + tax, total) : "";
}
function postBill(form) {
  const d = draft; const err = (m) => { $("#form-error").innerHTML = `<div class="notice error">${ICONS.warn}<div>${esc(m)}</div></div>`; };
  d.title = form.title.value.trim(); d.merchant = form.merchant.value.trim(); d.note = form.note.value.trim();
  if (!d.title) return err("Please give your bill a title.");
  const items = [];
  for (const i of d.items) {
    if (!i.name.trim() && !i.price) continue;
    const qty = Number(i.qty), cents = toCents(i.price);
    if (!i.name.trim()) return err("Every item needs a name.");
    if (!(qty > 0) || cents === null) return err(`Check the quantity and price for ${i.name}.`);
    items.push({ name: i.name.trim(), qty, lineCents: cents, unitCents: Math.round(cents / qty) });
  }
  const tax = toCents(d.tax), total = toCents(d.total);
  if (tax === null || total === null) return err("Tax and total need to be amounts like 12.34.");
  if (total <= 0) return err("Please enter the bill's total.");
  const bill = { id: "b-" + uid(), userId: db.currentUserId, title: d.title, merchant: d.merchant, description: d.note,
    image: d.sampleKey ? "sample:" + d.sampleKey : d.image, items, tax, total, subtotal: items.reduce((s, i) => s + i.lineCents, 0),
    blessedCents: 0, createdAt: Date.now() };
  db.bills.push(bill); save();
  draft = null; reset("myBills"); toast("Bill posted. Blessings members can see it now.");
}

// ---------------------------------------------------------------------------
// Accounts
// ---------------------------------------------------------------------------
function formError(msg) { const el = $("#form-error"); if (el) el.innerHTML = `<div class="notice error">${ICONS.warn}<div>${esc(msg)}</div></div>`; }
function validateAccount(f) {
  if (!f.name.value.trim()) return "Please enter your name.";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim())) return "Please enter a valid email address.";
  if (f.password.value.length < 8) return "Your password needs at least 8 characters.";
  if (f.password.value !== f.password2.value) return "Passwords don't match.";
  if (db.users.some((u) => u.email === f.email.value.trim().toLowerCase())) return "An account with that email already exists. Log in instead.";
  return null;
}
function signIn(user) { db.currentUserId = user.id; save(); closeSheet(); home(); }

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const actions = {
    back, go: () => go(el.dataset.to),
    account: () => openSheet("account"),
    "close-sheet": closeSheet,
    "quick-login": () => signIn(db.users.find((u) => u.email === el.dataset.email)),
    logout: () => { db.currentUserId = null; save(); closeSheet(); reset("welcome"); },
    "reset-demo": () => { db = seed(); save(); closeSheet(); reset("welcome"); toast("Demo data reset."); },
    "open-bill": () => go("bill", { id: el.dataset.id }),
    filter: () => { nav.at(-1).params.filter = el.dataset.filter; render(); },
    plan: () => {
      nav.at(-1).params.plan = el.dataset.plan;
      el.parentElement.querySelectorAll(".plan").forEach((p) => p.setAttribute("aria-checked", p === el));
    },
    subscribe: () => openSheet("purchase", { plan: nav.at(-1).params.plan || "yearly" }),
    "confirm-purchase": () => {
      const u = me(); const plan = el.dataset.plan;
      u.plan = plan;
      const months = { monthly: 1, yearly: 12, two_year: 24 }[plan];
      const end = new Date(); end.setMonth(end.getMonth() + months); u.planExpires = end.getTime();
      save(); closeSheet(); reset("feed"); toast(`Welcome! Your ${PLANS.find((p) => p.id === plan).name} plan is active.`);
    },
    bless: () => openSheet("bless", { id: el.dataset.id }),
    "bless-amount": () => { sheet.params.amount = el.dataset.v; renderSheet(); },
    "bless-pay": () => { const cents = toCents(sheet.params.amount); openSheet("pay", { id: el.dataset.id, cents }); },
    "confirm-pay": () => {
      const b = db.bills.find((x) => x.id === el.dataset.id); const cents = Number(el.dataset.cents);
      if (cents > remaining(b)) return;
      b.blessedCents += cents;
      db.blessings.push({ id: uid(), billId: b.id, userId: db.currentUserId, amountCents: cents, feeCents: tipFee(cents), createdAt: Date.now() });
      save(); render(); openSheet("thanks", { id: b.id, cents });
    },
    sample: () => startScan(sampleImage(el.dataset.key), el.dataset.key),
    rescan: () => { draft = { stage: "pick" }; render(); },
    "add-item": () => { draft.items.push({ name: "", qty: "1", price: "" }); render(); },
    "del-item": () => { draft.items.splice(Number(el.dataset.i), 1); render(); },
  };
  if (actions[act]) { e.preventDefault(); actions[act](); }
});
$("#demo-menu-btn").addEventListener("click", () => openSheet("demo"));

document.addEventListener("input", (e) => {
  const t = e.target;
  if (draft?.stage === "review" && t.dataset.item !== undefined) { draft.items[Number(t.dataset.item)][t.dataset.key] = t.value; refreshTotals(); }
  else if (draft?.stage === "review" && (t.dataset.key === "tax" || t.dataset.key === "total")) { draft[t.dataset.key] = t.value; refreshTotals(); }
  else if (t.id === "bless-amount" && sheet?.type === "bless") {
    sheet.params.amount = t.value;
    const b = db.bills.find((x) => x.id === sheet.params.id);
    const cents = toCents(t.value) ?? 0, left = remaining(b), tooMuch = cents > left;
    $("#bless-breakdown").innerHTML = blessBreakdown(cents, tipFee(cents));
    $("#bless-error").innerHTML = tooMuch ? `<div class="notice error">${ICONS.warn}<div>You can bless up to ${money(left)} on this bill.</div></div>` : "";
    document.querySelector('[data-act="bless-pay"]').disabled = cents <= 0 || tooMuch;
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.id !== "photo-input" || !e.target.files?.[0]) return;
  try { startScan(await downscale(e.target.files[0])); }
  catch { toast("That picture couldn't be opened. Try another one."); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form === "login") {
    const u = db.users.find((x) => x.email === f.email.value.trim().toLowerCase() && x.password === f.password.value);
    return u ? signIn(u) : formError("Incorrect email or password.");
  }
  if (f.dataset.form === "signup-billable") {
    const problem = validateAccount(f); if (problem) return formError(problem);
    const u = { id: "u-" + uid(), email: f.email.value.trim().toLowerCase(), password: f.password.value, displayName: f.name.value.trim(), role: "billable" };
    db.users.push(u); return signIn(u);
  }
  if (f.dataset.form === "signup-blessings") {
    const problem = validateAccount(f); if (problem) return formError(problem);
    const income = toCents(f.income.value);
    if (income === null) return formError("Please enter your yearly income, for example 85000.");
    const plan = nav.at(-1).params.plan || "yearly";
    const u = { id: "u-" + uid(), email: f.email.value.trim().toLowerCase(), password: f.password.value, displayName: f.name.value.trim(), role: "blessings", annualIncomeCents: income };
    db.users.push(u); db.currentUserId = u.id; save();
    reset("paywall", { plan });
    return openSheet("purchase", { plan });
  }
  if (f.dataset.form === "post") return postBill(f);
});

render();
</script>
