# Generate GetBlessed.xcodeproj with:  brew install xcodegen && xcodegen generate
name: GetBlessed
options:
  bundleIdPrefix: com.getblessed
  deploymentTarget:
    iOS: "17.0"
packages:
  BillParser:
    path: BillParser
targets:
  GetBlessed:
    type: application
    platform: iOS
    sources:
      - GetBlessed
    dependencies:
      - package: BillParser
    info:
      path: GetBlessed/Info.plist
      properties:
        CFBundleDisplayName: GetBlessed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: GetBlessed uses the camera to take a picture of your bill so it can read the items and total.
        NSPhotoLibraryUsageDescription: GetBlessed lets you choose a picture of your bill from your photo library.
        # Base URL of the GetBlessed API (see backend/). Override per configuration.
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getblessed.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        API_BASE_URL: http://localhost:3000
      configs:
        Release:
          API_BASE_URL: https://api.getblessed.app
schemes:
  GetBlessed:
    build:
      targets:
        GetBlessed: all
    test:
      targets:
        - package: BillParser/BillParserTests
