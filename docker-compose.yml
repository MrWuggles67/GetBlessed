# Local stack: MySQL 8 + the GetBlessed API.
#   JWT_SECRET=something-long docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: getblessed
      MYSQL_USER: getblessed
      MYSQL_PASSWORD: ${DB_PASSWORD:-getblessed}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DB_HOST: mysql
      DB_USER: getblessed
      DB_PASSWORD: ${DB_PASSWORD:-getblessed}
      DB_NAME: getblessed
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  uploads:
